# Development infrastructure only (PostgreSQL + MinIO)
# Start with: docker compose -f docker/docker-compose.dev.yml up -d

name: tsio-dev

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: tsio
      POSTGRES_PASSWORD: tsio
      POSTGRES_DB: tsio
    ports:
      - "6432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsio"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # mc alias used by the healthcheck (image has no curl).
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    # Same image ships mc + sh; no separate client image needed.
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/reports --ignore-existing;
      exit 0;
      "

  adminer:
    image: adminer:5.4.1
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
