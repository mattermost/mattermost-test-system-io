name: Test System IO — dispatch run
description: >
  Drain this matrix entry's slice of the orchestration queue. For each
  spec lease, invoke `npx playwright test`, archive the per-iteration
  Playwright JSON + screenshots, and report the result. At queue-empty,
  upload the worker's accumulated artifacts as one shard report via
  /api/v1/reports/*.
author: Mattermost

inputs:
  # ── Required (top-level) ─────────────────────────────────────────────
  composite-identity:
    description: Composite identity JSON (same payload the dispatch-begin action received)
    required: true
  repo-dir:
    description: >
      Path to the checked-out repo whose test suite this run covers
      (e.g. mattermost/mattermost). The e2e stack must already be up;
      the worker dispatches `npx playwright test` inside
      `<repo-dir>/<playwright-dir>` (or `cypress run` inside
      `<repo-dir>/<cypress-dir>` when `framework: cypress`, `detox test`
      inside `<repo-dir>/<detox-dir>` when `framework: detox`, or
      `maestro test` inside `<repo-dir>/<maestro-dir>` when
      `framework: maestro`).
    required: true
  artifacts-root:
    description: Writable directory for per-iteration archived results
    required: true
  github-token:
    description: Token with actions:read; used to look up gh_job_id
    required: true
  gh-job-name:
    description: >
      Rendered job name of the calling matrix entry (e.g. `orch-worker-3`).
      Used to resolve gh_job_id via the GitHub API and sent to the
      orchestrator + uploader as gh_job_name. Caller MUST keep this in
      sync with the workers job's `name:` field.
    required: true

  # ── Optional (top-level) ─────────────────────────────────────────────
  use-staging:
    description: >
      When true, target the staging deployment
      (https://staging-test-io.test.mattermost.com) instead of production
      (https://test-io.test.mattermost.com).
    required: false
    default: "false"
  oidc-audience:
    description: OIDC audience claim that the orchestrator expects
    required: false
    default: mattermost-test-system-io
  framework:
    description: |
      Test framework this worker drives. One of `playwright`, `cypress`, `detox`, or `maestro`.

      - `playwright` (default, for backward compatibility with existing consumers): invokes `npx playwright test --project=<playwright-project> --no-deps [--retries=<playwright-retries>] <leased>` from `<repo-dir>/<playwright-dir>` and reads `<results-dir>/reporter/results.json`.
      - `cypress`: invokes `npx cypress run --reporter cypress-multi-reporters --reporter-options configFile=reporter-config.json --spec <leased>` from `<repo-dir>/<cypress-dir>` and reads each leased spec's Mochawesome JSON from `results/mochawesome-report/json/tests/[name].json` (the path reporter-config.json prescribes via reportDir + reportFilename).
      - `detox`: invokes `npx detox test <leased> -c <detox-config> --record-logs failing --take-screenshots failing --artifacts-location <iter-dir>/artifacts -- --json --outputFile <iter-dir>/jest-results.json` from `<repo-dir>/<detox-dir>` and reads Jest's native `--json` output.
      - `maestro`: invokes `maestro test [--device <maestro-device>] [--platform <maestro-platform>] --format junit --output <iter-dir>/maestro-batch.xml --test-output-dir <iter-dir>/artifacts --flatten-debug-output <leased>` from `<repo-dir>/<maestro-dir>` (one flow file per invocation) and reads Maestro's native JUnit output.
    required: false
    default: "playwright"
  max-idle-polls:
    description: >
      Maximum number of consecutive empty-queue /checkout polls before this
      worker gives up and exits on its own. Resets to 0 whenever the worker
      leases a unit. Purely client-side; other active workers can cover
      whatever remains. Set to "0" to disable and poll until the server
      says stop.
    required: false
    default: "5"
  post-failure-delay-ms:
    description: >
      Extra sleep, in milliseconds, after this worker reports a
      retest-eligible result (failed / timedOut / interrupted), before its
      next /checkout call. Gives another worker's poll a chance to pick up
      the retest first. Set to "0" to disable and call /checkout again
      immediately.
    required: false
    default: "10000"

  # ── Playwright-specific ──────────────────────────────────────────────
  playwright-dir:
    description: >
      Path to the Playwright project, relative to `repo-dir`. Defaults to
      `e2e-tests/playwright` (the layout used by mattermost/mattermost);
      override for repos that put Playwright somewhere else. Ignored
      when `framework: cypress`.
    required: false
    default: e2e-tests/playwright
  playwright-project:
    description: >
      Playwright project name passed to each per-spec invocation as
      `--project=`. Defaults to `chrome` (the canonical mattermost
      project). Keep this in sync with the same input on
      `test-system-io-dispatch-begin` so the run-level metadata and the
      worker invocation match. Ignored when `framework: cypress`.
    required: false
    default: chrome
  playwright-retries:
    description: >
      Value passed to `npx playwright test --retries=N` so Playwright
      handles flaky-test retries within a single process invocation.
      Set to 0 to disable Playwright-internal retries.
    required: false
    default: "1"
  results-dir:
    description: >
      Path to Playwright's results output, relative to `playwright-dir`.
      Must match the `outputDir` configured in the consumer repo's
      `playwright.config.ts`. Defaults to `results`. Ignored when
      `framework: cypress`.
    required: false
    default: results

  # ── Cypress-specific ─────────────────────────────────────────────────
  cypress-dir:
    description: >
      Path to the Cypress project, relative to `repo-dir`. Defaults to
      `e2e-tests/cypress` (the layout used by mattermost/mattermost).
      Only consulted when `framework: cypress`.
    required: false
    default: e2e-tests/cypress

  # ── Detox-specific ───────────────────────────────────────────────────
  detox-dir:
    description: >
      Path to the Detox project, relative to `repo-dir`. Defaults to
      `detox` (the layout used by mattermost/mattermost-mobile). Only
      consulted when `framework: detox`.
    required: false
    default: detox
  detox-config:
    description: >
      Detox configuration name passed to each per-spec invocation as
      `-c` (e.g. `ios.sim.debug`, `android.emu.debug`, `ios.ipad.debug`).
      The simulator/emulator + Metro must already be up and matching this
      configuration before the worker starts leasing — the action does not
      own that setup. Detox only.
    required: false
    default: ios.sim.debug
  batch-size:
    description: >
      Units to request per `/orchestration/checkout` call. Defaults to 1
      (one spec per lease). Detox consumers that boot multiple devices
      typically set this to 4 so each lease feeds a parallel Jest run.
      Maestro always checks out with batch_size=1 regardless of this input
      (one flow per invocation).
    required: false
    default: "1"
  detox-max-workers:
    description: >
      Value forwarded as `DETOX_MAX_WORKERS` for each Detox invocation so
      Jest/`maxWorkers` can run that many specs concurrently on the
      pre-booted devices. Defaults to 1. Detox only; ignored for other
      frameworks. Caller must boot at least this many devices first.
    required: false
    default: "1"

  # ── Maestro-specific ─────────────────────────────────────────────────
  maestro-dir:
    description: >
      Path to the Maestro flow tree, relative to `repo-dir`. Defaults to
      `detox/maestro` (the layout used by mattermost/mattermost-mobile).
      Only consulted when `framework: maestro`.
    required: false
    default: detox/maestro
  maestro-device:
    description: >
      Device UDID / AVD name / emulator serial passed to each per-spec
      invocation as `--device`. The simulator/emulator must already be up
      before the worker starts leasing — the action does not own that
      setup. Empty omits `--device` (Maestro picks the sole connected
      device). Maestro only.
    required: false
    default: ""
  maestro-platform:
    description: >
      Platform passed to each per-spec invocation as `--platform` (e.g.
      `android`). Empty omits `--platform` (Maestro infers it from the
      connected device). Maestro only.
    required: false
    default: ""
  maestro-env:
    description: >
      One `KEY=VALUE` pair per line, forwarded as `--env KEY=VALUE` to each
      per-spec invocation. Maestro flows template `${SITE_1_URL}`,
      `${TEST_USER_EMAIL}`, etc. — the CLI only resolves those from
      explicit --env flags, not this action's own process environment, so
      set this to whatever the consumer's flows reference. Empty omits all
      --env flags. Maestro only.
    required: false
    default: ""
  maestro-timeout-ms:
    description: >
      Ceiling (ms) for a single `maestro test` invocation. On expiry the
      action kills Maestro and its process group, reports the unit as
      `interrupted`, and proceeds to `/complete`. Keep this below the
      run's `lease-timeout-ms` so the worker finishes before the server
      reclaims the lease. Maestro only.
    required: false
    default: "540000"

runs:
  using: node24
  main: dist/index.js
