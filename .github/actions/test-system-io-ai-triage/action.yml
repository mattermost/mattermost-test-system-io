name: Test System IO — AI flake triage
description: >
  Classify clustered E2E failures as flakes or regressions using Test System IO
  APIs and artifacts. Does not rerun tests. Cost scales with distinct error
  signatures, not failure count.

  GET /api/v1/triage/evidence supplies the pack (failures clustered by
  normalized error, plus history and screenshots). Deterministic history rules
  decide the obvious cases. Residue is investigated by an agent that calls
  TSIO (history, failing-elsewhere, screenshots) and, for bugs, GitHub compare
  to name the introducing commit/author when the range is a single non-merge
  commit. A policy engine — not the model — decides whether anything is waived.
  Fail closed.

  Posts an optional triage commit-status when no original contexts are named.
  In `mode: gate`, always rewrites the original e2e-test/* row: success when
  every failure is a waived flake, otherwise keeps failure and annotates the
  description with product-bug vs test-bug blame (using the existing pass/fail
  counts when available).
author: Mattermost

inputs:
  task:
    description: >
      triage (default) adjudicates the run that invoked this action.
      replay re-adjudicates runs Test System IO has already ingested — same
      evidence pack, classifier, model and policy layer — and records the
      results as ledger rows marked `replay`. Replay never sets a commit status
      and never comments; it exists to produce an accuracy number before any
      calling workflow is gating. It ignores composite-identity and reads
      replay-repo instead.
    required: false
    default: triage
  replay-repo:
    description: Repository to replay (task=replay). Slug or full owner/name.
    required: false
    default: ""
  replay-branch:
    description: Restrict replay to one branch. Empty replays every branch.
    required: false
    default: ""
  replay-days:
    description: How far back to look for unadjudicated failing runs (1-180).
    required: false
    default: "30"
  replay-limit:
    description: Maximum runs per invocation (1-500). Each run costs model calls.
    required: false
    default: "20"
  use-staging:
    description: When true, target staging instead of production.
    required: false
    default: "false"
  oidc-audience:
    description: OIDC audience claim that the orchestrator expects.
    required: false
    default: mattermost-test-system-io
  composite-identity:
    description: >
      Composite identity JSON (same payload the begin action received).
      Required for task=triage; unused by task=replay.
    required: false
    default: ""
  group-id:
    description: Report-group UUID. Optional; composite-identity is enough.
    required: false
    default: ""
  baseline-branch:
    description: Branch history is measured on (not the PR branch).
    required: false
    default: main
  run-type:
    description: PR | MAIN | RELEASE. RELEASE never auto-waives; PR and MAIN may waive confirmed flakes.
    required: false
    default: PR
  mode:
    description: >
      shadow never rewrites the original e2e-test/* check. gate rewrites it:
      waived flakes → success; unwaived → stay failure with product/test-bug
      description. When original-commit-status-contexts is set, no separate
      e2e-test/ai-triage-* row is posted.
    required: false
    default: shadow
  commit-status-context:
    description: >
      Optional triage commit-status context. Ignored (not posted) when
      original-commit-status-contexts is set — the platform row is the signal.
    required: false
    default: e2e-test/ai-triage
  original-commit-status-contexts:
    description: >
      Comma-separated original e2e-test/* contexts to rewrite after triage
      (mode: gate). Empty means discover red e2e-test/* rows on the commit,
      excluding ai-triage*. Must match the context the summary action posted.
    required: false
    default: ""
  github-token:
    description: Token for commit status, PR file list, and blame compare.
    required: false
    default: ${{ github.token }}
  pr-token:
    description: >
      Optional PAT for privileged GitHub ops (PR comments). The reusable-workflow
      GITHUB_TOKEN is often capped (contents:read + statuses) and cannot comment;
      falls back to github-token when unset.
    required: false
    default: ""
  anthropic-api-key:
    description: >
      Optional. When set, residue clusters are investigated by an agent with
      TSIO tools (history, screenshots, blame). When absent, residue stays on
      the history suggestion (usually red).
    required: false
    default: ""
  claude-model:
    description: Claude model id.
    required: false
    default: claude-sonnet-4-6
outputs:
  state:
    description: Final triage check state (success | failure).
  waived:
    description: Whether every failure was waived.
  verdict:
    description: Worst remaining verdict (empty when there were no failures).
  description:
    description: Single-line commit-status description.
  report_url:
    description: Test System IO report URL for this run.
  flipped_contexts:
    description: Original e2e-test/* contexts flipped to success (empty unless mode is gate and every failure was waived).
  replayed:
    description: Replay mode — runs re-adjudicated and recorded in the ledger.
  ledger_failures:
    description: Replay mode — runs whose ledger write failed, so they stay unmeasured.

runs:
  using: node24
  main: dist/index.js
