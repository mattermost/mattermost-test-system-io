name: Test System IO — run summary
description: >
  Read /api/v1/orchestration/status and write a Markdown job summary to
  $GITHUB_STEP_SUMMARY linking to the per-group dashboard page. Exits
  non-zero when any unit ended in completed_fail or the run did not reach
  `completed`. Framework-agnostic. Authenticates via the calling
  workflow's GitHub Actions OIDC token, so the workflow MUST grant
  `permissions: id-token: write`.
author: Mattermost

inputs:
  use-staging:
    description: >
      When true, target the staging deployment
      (https://staging-test-io.test.mattermost.com) instead of production
      (https://test-io.test.mattermost.com).
    required: false
    default: "false"
  oidc-audience:
    description: OIDC audience claim that the orchestrator expects
    required: false
    default: mattermost-test-system-io
  composite-identity:
    description: Composite identity JSON (same payload the begin action received)
    required: true
  framework:
    description: >
      Test framework label rendered in the job-summary header
      (e.g. `playwright`, `cypress`).
    required: true
  fail-on-test-failures:
    description: When true (default), exit non-zero if any unit ended in completed_fail
    required: false
    default: "true"

runs:
  using: node24
  main: dist/index.js
