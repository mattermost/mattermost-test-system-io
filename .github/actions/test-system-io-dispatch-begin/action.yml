name: Test System IO — dispatch begin
description: >
  Walk the test-suite spec directory and POST /api/v1/orchestration/begin
  to create the dispatch queue for this composite identity. Supports
  Playwright (default) and Cypress via the `framework` input.
  Authenticates to Test System IO via the calling workflow's GitHub
  Actions OIDC token, so the workflow MUST grant
  `permissions: id-token: write`.
author: Mattermost

inputs:
  # ── Required (top-level) ─────────────────────────────────────────────
  composite-identity:
    description: >
      Composite identity JSON with the keys repository, commit_sha,
      gh_run_id, gh_run_attempt, name, and (optional) branch / gh_pr_number.
      Same payload the worker action receives.
    required: true
  repo-dir:
    description: >
      Path to the checked-out repo whose test suite this run covers
      (e.g. mattermost/mattermost). The action enumerates spec files
      under `<repo-dir>/<playwright-dir>/specs` (Playwright) or
      `<repo-dir>/<cypress-dir>/tests/integration` (Cypress).
    required: true
  total-reports-expected:
    description: >
      Number of per-shard reports the run will produce (== the worker
      matrix size). Frozen on first /reports/begin; the report group
      auto-finalizes once that many child reports reach `complete`.
    required: true

  # ── Optional (top-level) ─────────────────────────────────────────────
  use-staging:
    description: >
      When true, target the staging deployment
      (https://staging-test-io.test.mattermost.com) instead of production
      (https://test-io.test.mattermost.com).
    required: false
    default: "false"
  oidc-audience:
    description: OIDC audience claim that the orchestrator expects
    required: false
    default: mattermost-test-system-io
  framework:
    description: >
      Test framework this run dispatches. One of `playwright` or
      `cypress`. Defaults to `playwright` for backward compatibility
      with existing consumers. When `cypress`, the action enumerates
      `*_spec.{ts,js}` files under `<repo-dir>/<cypress-dir>/tests/integration/`
      and submits them as dispatch units; the orchestration_runs row is
      created with `framework: "cypress"`.
    required: false
    default: "playwright"
  retest-on-fail:
    description: Whether the orchestrator should re-dispatch failed dispatch units once
    required: false
    default: "false"
  retest-budget:
    description: >
      Maximum number of retest passes the orchestrator will dispatch when
      `retest-on-fail` is true. Ignored when `retest-on-fail` is false.
    required: false
    default: "1"
  idle-timeout-ms:
    description: >
      Inactivity window (ms) after which the orchestrator transitions an
      idle run to `timed_out`. Bumped on every checkout / complete, so
      any progress resets the clock.
    required: false
    default: "600000"
  lease-timeout-ms:
    description: >
      Per-lease ceiling (ms) before a stuck worker's units are reclaimed
      and re-dispatched.
    required: false
    default: "600000"

  # ── PR comment (optional) ───────────────────────────────────────────
  post-pr-comment:
    description: >
      When `"true"` and the composite identity carries a `gh_pr_number`,
      post a "started" status comment on the PR keyed by the marker
      `<!-- test-system-io:<name>@<short_sha> -->`. A re-run on the same
      commit replaces the existing comment. No-op for non-PR runs.
    required: false
    default: "false"
  github-token:
    description: >
      GitHub token with `pull-requests: write` scope. Required only
      when `post-pr-comment` is `"true"`.
    required: false
    default: ""
  test-type:
    description: Test-type label folded into the comment heading (e.g. `full`).
    required: false
    default: ""
  server-edition:
    description: Server edition folded into the comment heading (e.g. `enterprise`, `fips`).
    required: false
    default: ""

  # ── Playwright-specific ──────────────────────────────────────────────
  playwright-dir:
    description: >
      Path to the Playwright project, relative to `repo-dir`. Defaults
      to `e2e-tests/playwright` (the layout used by mattermost/mattermost);
      override for repos that put Playwright somewhere else. Ignored
      when `framework: cypress`.
    required: false
    default: e2e-tests/playwright
  playwright-project:
    description: >
      Playwright project name recorded on the run as metadata (sent to
      `/orchestration/begin` as `playwright_project`). Does NOT drive
      the worker invocation — the worker reads its own
      `playwright-project` input. Keep both in sync so the dashboard
      reflects what actually ran. Defaults to `chrome`. Ignored when
      `framework: cypress`.
    required: false
    default: chrome

  # ── Cypress-specific ─────────────────────────────────────────────────
  cypress-dir:
    description: >
      Path to the Cypress project, relative to `repo-dir`. Defaults to
      `e2e-tests/cypress` (the layout used by mattermost/mattermost).
      Spec discovery walks `<cypress-dir>/tests/integration/` for
      `*_spec.{ts,js}` files. Only consulted when `framework: cypress`.
    required: false
    default: e2e-tests/cypress
  cypress-stage:
    description: >
      Comma-separated `// Stage:` tag list. A spec is kept only when its
      Stage line shares at least one tag with this list. Empty disables
      the filter. Default `@prod` matches the upstream automation
      dashboard's stable cycle. Cypress only.
    required: false
    default: "@prod"
  cypress-include-group:
    description: >
      Comma-separated `// Group:` tag list. A spec is kept only when its
      Group line shares at least one tag with this list. Empty disables
      the filter. Cypress only.
    required: false
    default: ""
  cypress-exclude-group:
    description: >
      Comma-separated `// Group:` tag list. A spec is dropped when its
      Group line shares any tag with this list. Applied after the
      include filter. Cypress only.
    required: false
    default: ""
  cypress-skip-on:
    description: >
      Comma-separated active-environment tag list — runtime traits the
      worker exhibits that some specs declare incompatible with via
      `// Skip:`. Typical entries: `@headless` (workers run headless by
      default) and `@firefox` (when overriding the default browser).
      Chromium-family browsers (chrome, electron, edge) are the default
      test environment and don't need entries here. Cypress only.
    required: false
    default: ""
  cypress-sort-first:
    description: >
      Comma-separated `// Group:` tag list. Surviving specs whose Group
      shares any tag dispatch first, surfacing flagged tests early.
      A spec matching both sort-first and sort-last goes to sort-first.
      Cypress only.
    required: false
    default: ""
  cypress-sort-last:
    description: >
      Comma-separated `// Group:` tag list. Surviving specs whose Group
      shares any tag dispatch last, keeping known-broken tests at the
      back of the queue. Cypress only.
    required: false
    default: "@known_issue"

outputs:
  run-id:
    description: Server-assigned run id (uuidv7)
  total-units:
    description: Number of dispatch units created on the server

runs:
  using: node24
  main: dist/index.js
