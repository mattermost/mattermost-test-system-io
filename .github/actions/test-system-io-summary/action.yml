name: Test System IO — run summary
description: >
  Read /api/v1/orchestration/status and produce all formatted CI artifacts
  the consumer needs:
    * a Markdown job summary written to $GITHUB_STEP_SUMMARY,
    * `commit_status_description` ready to feed update-commit-status'
      `description` input verbatim,
    * `webhook_payload` ready to POST as-is to a Mattermost-style webhook.
  When `update-commit-status: "true"` is set, also flips the `pending`
  commit status the begin action pushed to `success`/`failure`/`error`
  on the same commit + context — `target_url` keeps deep-linking the
  Test System IO report page. Requires `permissions: statuses: write`
  and a `github-token` with the same scope.
  Exits non-zero when any unit ended in completed_fail or the run did not
  reach `completed`. Authenticates via the calling workflow's GitHub Actions
  OIDC token, so the workflow MUST grant `permissions: id-token: write`.
author: Mattermost

inputs:
  use-staging:
    description: >
      When true, target the staging deployment
      (https://staging-test-io.test.mattermost.com) instead of production
      (https://test-io.test.mattermost.com).
    required: false
    default: "false"
  oidc-audience:
    description: OIDC audience claim that the orchestrator expects
    required: false
    default: mattermost-test-system-io
  composite-identity:
    description: Composite identity JSON (same payload the begin action received)
    required: true
  framework:
    description: >
      Test framework label (e.g. `playwright`, `cypress`). Surfaced in the
      step summary header as a free-form tag. Kept explicit rather than
      derived from `commit-status-context` because consumers in other repos may
      pick context names that do not encode framework information.
    required: true
  commit-status-context:
    description: >
      Slash-separated context label (e.g. `e2e-test/playwright-full/enterprise`)
      used as the commit-status `context` and rendered in the summary
      header and webhook title. Must match the value the begin action
      received so this finalizer flips the same commit-status row.
    required: true
  fail-on-test-failures:
    description: When true (default), exit non-zero if any unit ended in completed_fail
    required: false
    default: "true"

  # Formatting inputs — feed the commit_status_description and
  # webhook_payload outputs. All optional; omitted segments degrade
  # gracefully (e.g. no `image_tag:X` if image-tag is not provided).
  report-type:
    description: >
      One of `PR` (default), `MASTER`, `RELEASE`, `RELEASE_CUT`. Drives
      the webhook source-line shape (PR icon + PR link vs. commit icon +
      branch link).
    required: false
    default: "PR"
  image-tag:
    description: Server image tag rendered in the commit-status description (e.g. `master`, `9e955bf_3521709`).
    required: false
    default: ""
  image-aliases:
    description: Optional comma-separated alias suffix appended to image_tag (e.g. `release-11.4, release-11`).
    required: false
    default: ""
  server-image:
    description: >
      Full Docker image string surfaced in the webhook attachment
      (e.g. `mattermostdevelopment/mattermost-enterprise-edition:abc123`).
      Falls back to image-tag when omitted.
    required: false
    default: ""
  pr-number:
    description: PR number used in webhook source line (overrides composite-identity.gh_pr_number when set).
    required: false
    default: ""
  ref-branch:
    description: Source branch name used in webhook source line for non-PR runs (e.g. `master`, `release-11.4`).
    required: false
    default: ""
  webhook-username:
    description: Username surfaced on the webhook post.
    required: false
    default: "E2E Test"
  webhook-icon-url:
    description: Avatar URL surfaced on the webhook post.
    required: false
    default: "https://mattermost.com/wp-content/uploads/2022/02/icon_WS.png"
  update-commit-status:
    description: >
      When `"true"` (default), flip the `pending` GitHub commit status
      the begin action pushed to a terminal state on the same commit +
      context. `target_url` continues to deep-link the Test System IO
      report page so the commit-status row stays the single entrypoint
      into the dashboard.

      State mapping:
        * `success` — run reached `completed` and no failed units.
        * `failure` — run reached `completed` but recorded failed units.
        * `error`   — run did not reach `completed` (timed_out, incomplete).

      Requires `commit-status-context` to match the value used by the begin
      action and `github-token` with `statuses: write` scope. Requires
      `permissions: statuses: write` on the calling job. Set to
      `"false"` to opt out.
    required: false
    default: "true"
  github-token:
    description: >
      GitHub token with `statuses: write` scope. Required only when
      `update-commit-status` is `"true"`.
    required: false
    default: ""

outputs:
  passed:
    description: >
      Number of test cases that passed. Counts flaky-but-eventually-passed
      tests as passed, matching the dashboard's listing rollup. Falls back
      to dispatch-unit pass count when the per-test rollup is unavailable
      (e.g. no shard reports uploaded yet).
  failed:
    description: Number of test cases that ended in failed/timed_out/interrupted.
  flaky:
    description: Number of test cases that ever-passed AND ever-failed across attempts.
  skipped:
    description: Number of test cases that ended in skipped (no pass/fail attempt).
  total_specs:
    description: Total number of dispatch units (one per spec) the run covered.
  pass_rate:
    description: Pass percentage as a string (e.g. `100%`, `99.5%`); excludes skipped from denominator.
  setup_duration_ms:
    description: >
      Wall-clock milliseconds from run begin to the first checkout
      (`first_test_at - begin_at`). Empty until the first attempt is dispatched.
  first_pass_duration_ms:
    description: >
      Pure first-pass dispatch wall-clock milliseconds — `first_pass_end - first_test_at`,
      excluding the setup window. Empty until a first attempt reports.
  retest_duration_ms:
    description: Wall-clock milliseconds spent on retest dispatches. Empty when no unit was re-leased.
  retest_unit_count:
    description: Distinct dispatch units that had at least one retest attempt.
  webhook_color:
    description: Hex color keyed on pass-rate (`#43A047`/`#FFEB3B`/`#FF9800`/`#F44336`).
  commit_status_message:
    description: >
      Short summary. Examples:
      `100% passed (1345), 446 specs`,
      `96.8% passed (457/472), 117 specs, 15 failed`.
  commit_status_description:
    description: >
      Fully-formatted description ready to plug into the commit-status
      `description` input — message + duration segments + image-tag, no further
      wrangling needed on the consumer side. Example:
      `96.8% passed (457/472), 117 specs, 15 failed, (5m setup) + 14m 1s + 2m 15s (retest), image_tag:9e955bf_3521709 (release-11.4, release-11)`.
  webhook_payload:
    description: Mattermost-style webhook JSON ready to POST as-is.
  report_url:
    description: >
      Test System IO report URL for this run — same value used as the
      commit-status `target_url`. Mirrors the begin action's
      `report-url` output so downstream steps can reuse it.

runs:
  using: node24
  main: dist/index.cjs
