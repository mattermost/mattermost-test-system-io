name: Test System IO — dispatch run
description: >
  Drain this matrix entry's slice of the orchestration queue. For each
  spec lease, invoke `npx playwright test`, archive the per-iteration
  Playwright JSON + screenshots, and report the result. At queue-empty,
  upload the worker's accumulated artifacts as one shard report via
  /api/v1/reports/*.
author: Mattermost

inputs:
  # ── Required (top-level) ─────────────────────────────────────────────
  composite-identity:
    description: Composite identity JSON (same payload the dispatch-begin action received)
    required: true
  repo-dir:
    description: >
      Path to the checked-out repo whose test suite this run covers
      (e.g. mattermost/mattermost). The e2e stack must already be up;
      the worker dispatches `npx playwright test` inside
      `<repo-dir>/<playwright-dir>` (or `cypress run` inside
      `<repo-dir>/<cypress-dir>` when `framework: cypress`).
    required: true
  artifacts-root:
    description: Writable directory for per-iteration archived results
    required: true
  github-token:
    description: Token with actions:read; used to look up gh_job_id
    required: true
  gh-job-name:
    description: >
      Rendered job name of the calling matrix entry (e.g. `orch-worker-3`).
      Used to resolve gh_job_id via the GitHub API and sent to the
      orchestrator + uploader as gh_job_name. Caller MUST keep this in
      sync with the workers job's `name:` field.
    required: true

  # ── Optional (top-level) ─────────────────────────────────────────────
  use-staging:
    description: >
      When true, target the staging deployment
      (https://staging-test-io.test.mattermost.com) instead of production
      (https://test-io.test.mattermost.com).
    required: false
    default: "false"
  oidc-audience:
    description: OIDC audience claim that the orchestrator expects
    required: false
    default: mattermost-test-system-io
  framework:
    description: >
      Test framework this worker drives. One of `playwright` or
      `cypress`. Defaults to `playwright` for backward compatibility
      with existing consumers. When `cypress`, the action invokes
      `npx cypress run --reporter cypress-multi-reporters
      --reporter-options configFile=reporter-config.json --spec <leased>`
      from `<repo-dir>/<cypress-dir>` and reads each leased spec's
      Mochawesome JSON from
      `results/mochawesome-report/json/tests/[name].json` (the path
      reporter-config.json prescribes via reportDir + reportFilename).
    required: false
    default: "playwright"
  max-idle-polls:
    description: >
      Maximum number of consecutive empty-queue /checkout polls before this
      worker gives up and exits on its own. Resets to 0 whenever the worker
      leases a unit. Purely client-side; other active workers can cover
      whatever remains. Set to "0" to disable and poll until the server
      says stop.
    required: false
    default: "5"
  post-failure-delay-ms:
    description: >
      Extra sleep, in milliseconds, after this worker reports a
      retest-eligible result (failed / timedOut / interrupted), before its
      next /checkout call. Gives another worker's poll a chance to pick up
      the retest first. Set to "0" to disable and call /checkout again
      immediately.
    required: false
    default: "10000"

  # ── Playwright-specific ──────────────────────────────────────────────
  playwright-dir:
    description: >
      Path to the Playwright project, relative to `repo-dir`. Defaults to
      `e2e-tests/playwright` (the layout used by mattermost/mattermost);
      override for repos that put Playwright somewhere else. Ignored
      when `framework: cypress`.
    required: false
    default: e2e-tests/playwright
  playwright-project:
    description: >
      Playwright project name passed to each per-spec invocation as
      `--project=`. Defaults to `chrome` (the canonical mattermost
      project). Keep this in sync with the same input on
      `test-system-io-dispatch-begin` so the run-level metadata and the
      worker invocation match. Ignored when `framework: cypress`.
    required: false
    default: chrome
  playwright-retries:
    description: >
      Value passed to `npx playwright test --retries=N` so Playwright
      handles flaky-test retries within a single process invocation.
      Set to 0 to disable Playwright-internal retries.
    required: false
    default: "1"
  results-dir:
    description: >
      Path to Playwright's results output, relative to `playwright-dir`.
      Must match the `outputDir` configured in the consumer repo's
      `playwright.config.ts`. Defaults to `results`. Ignored when
      `framework: cypress`.
    required: false
    default: results

  # ── Cypress-specific ─────────────────────────────────────────────────
  cypress-dir:
    description: >
      Path to the Cypress project, relative to `repo-dir`. Defaults to
      `e2e-tests/cypress` (the layout used by mattermost/mattermost).
      Only consulted when `framework: cypress`.
    required: false
    default: e2e-tests/cypress

runs:
  using: node24
  main: dist/index.js
