name: Test System IO — dispatch begin
description: >
  Walk the test-suite spec directory and POST /api/v1/orchestration/begin
  to create the dispatch queue for this composite identity. Supports
  Playwright (default), Cypress, and Detox via the `framework` input.
  Authenticates to Test System IO via the calling workflow's GitHub
  Actions OIDC token, so the workflow MUST grant
  `permissions: id-token: write`. When `post-pending-commit-status: "true"`
  is also set, pushes a `pending` GitHub commit status whose
  `target_url` deep-links to the Test System IO report page — this
  needs `permissions: statuses: write` and a `github-token` with the
  same scope.
author: Mattermost

inputs:
  # ── Required (top-level) ─────────────────────────────────────────────
  composite-identity:
    description: >
      Composite identity JSON with the keys repository, commit_sha,
      gh_run_id, gh_run_attempt, name, and (optional) branch / gh_pr_number.
      Same payload the worker action receives.
    required: true
  repo-dir:
    description: >
      Path to the checked-out repo whose test suite this run covers
      (e.g. mattermost/mattermost). The action enumerates spec files
      under `<repo-dir>/<playwright-dir>/specs` (Playwright) or
      `<repo-dir>/<cypress-dir>/tests/integration` (Cypress).
    required: true
  total-reports-expected:
    description: >
      Number of per-shard reports the run will produce (== the worker
      matrix size). Frozen on first /reports/begin; the report group
      auto-finalizes once that many child reports reach `complete`.
    required: true

  # ── Optional (top-level) ─────────────────────────────────────────────
  use-staging:
    description: >
      When true, target the staging deployment
      (https://staging-test-io.test.mattermost.com) instead of production
      (https://test-io.test.mattermost.com).
    required: false
    default: "false"
  oidc-audience:
    description: OIDC audience claim that the orchestrator expects
    required: false
    default: mattermost-test-system-io
  framework:
    description: |
      Test framework this run dispatches. One of `playwright`, `cypress`, `detox`, or `maestro`.

      - `playwright` (default, for backward compatibility with existing consumers): enumerates files matching `testDir`/`testMatch` from `<repo-dir>/<playwright-dir>/playwright.config.*` (excluding `test_setup.ts` and `specs/visual/`) and submits them as dispatch units; the orchestration_runs row is created with `framework: "playwright"`.
      - `cypress`: enumerates `*_spec.{ts,js}` files under `<repo-dir>/<cypress-dir>/tests/integration/` and submits them as dispatch units; the orchestration_runs row is created with `framework: "cypress"`.
      - `detox`: enumerates `*.e2e.ts` files under `<repo-dir>/<detox-dir>/<detox-search-path>/` and submits them as dispatch units; the orchestration_runs row is created with `framework: "detox"`.
      - `maestro`: enumerates `*.yml`/`*.yaml` flow files under `<repo-dir>/<maestro-dir>/<maestro-flow-path>/` and submits them as dispatch units; the orchestration_runs row is created with `framework: "maestro"`.
    required: false
    default: "playwright"
  retest-on-fail:
    description: Whether the orchestrator should re-dispatch failed dispatch units once
    required: false
    default: "false"
  retest-budget:
    description: >
      Maximum number of retest passes the orchestrator will dispatch when
      `retest-on-fail` is true. Ignored when `retest-on-fail` is false.
    required: false
    default: "1"
  idle-timeout-ms:
    description: >
      Inactivity window (ms) after which the orchestrator transitions an
      idle run to `timed_out`. Bumped on every checkout / complete, so
      any progress resets the clock.
    required: false
    default: "600000"
  lease-timeout-ms:
    description: >
      Per-lease ceiling (ms) before a stuck worker's units are reclaimed
      and re-dispatched.
    required: false
    default: "600000"

  # ── Commit status (optional) ────────────────────────────────────────
  post-pending-commit-status:
    description: >
      When `"true"` (default), push a `pending` GitHub commit status
      whose `target_url` deep-links to the Test System IO report page.
      The reviewer clicks the commit-status row on the PR / commit and
      lands directly on the live dashboard, so no PR comment is needed.
      Requires `commit-status-context` and `github-token`. Set to `"false"` to
      opt out.
    required: false
    default: "true"
  github-token:
    description: >
      GitHub token with `statuses: write` scope. Required only when
      `post-pending-commit-status` is `"true"`.
    required: false
    default: ""
  commit-status-context:
    description: >
      Commit-status context name (e.g. `e2e-test/playwright-full/enterprise`).
      Must match the context the finalizer (`test-system-io-summary`)
      uses so the pending status transitions to success/failure on the
      same row. Required when `post-pending-commit-status` is `"true"`.
    required: false
    default: ""
  image-tag:
    description: >
      Server image tag rendered in the commit-status description
      (e.g. `master`, `9e955bf_3521709`). Surfaced as
      `tests running, image_tag:<tag>`; omitted when empty.
    required: false
    default: ""
  image-aliases:
    description: >
      Optional comma-separated alias suffix appended to image_tag
      (e.g. `release-11.4, release-11`).
    required: false
    default: ""

  # ── Playwright-specific ──────────────────────────────────────────────
  playwright-dir:
    description: >
      Path to the Playwright project, relative to `repo-dir`. Defaults
      to `e2e-tests/playwright` (the layout used by mattermost/mattermost);
      override for repos that put Playwright somewhere else. Ignored
      when `framework: cypress`.
    required: false
    default: e2e-tests/playwright
  playwright-project:
    description: >
      Playwright project name recorded on the run as metadata (sent to
      `/orchestration/begin` as `playwright_project`). Does NOT drive
      the worker invocation — the worker reads its own
      `playwright-project` input. Keep both in sync so the dashboard
      reflects what actually ran. Defaults to `chrome`. Ignored when
      `framework: cypress`.
    required: false
    default: chrome

  # ── Cypress-specific ─────────────────────────────────────────────────
  cypress-dir:
    description: >
      Path to the Cypress project, relative to `repo-dir`. Defaults to
      `e2e-tests/cypress` (the layout used by mattermost/mattermost).
      Spec discovery walks `<cypress-dir>/tests/integration/` for
      `*_spec.{ts,js}` files. Only consulted when `framework: cypress`.
    required: false
    default: e2e-tests/cypress
  cypress-stage:
    description: >
      Comma-separated `// Stage:` tag list. A spec is kept only when its
      Stage line shares at least one tag with this list. Empty disables
      the filter. Default `@prod` matches the upstream automation
      dashboard's stable cycle. Cypress only.
    required: false
    default: "@prod"
  cypress-include-group:
    description: >
      Comma-separated `// Group:` tag list. A spec is kept only when its
      Group line shares at least one tag with this list. Empty disables
      the filter. Cypress only.
    required: false
    default: ""
  cypress-exclude-group:
    description: >
      Comma-separated `// Group:` tag list. A spec is dropped when its
      Group line shares any tag with this list. Applied after the
      include filter. Cypress only.
    required: false
    default: ""
  cypress-skip-on:
    description: >
      Comma-separated active-environment tag list — runtime traits the
      worker exhibits that some specs declare incompatible with via
      `// Skip:`. Typical entries: `@headless` (workers run headless by
      default) and `@firefox` (when overriding the default browser).
      Chromium-family browsers (chrome, electron, edge) are the default
      test environment and don't need entries here. Cypress only.
    required: false
    default: ""
  cypress-sort-first:
    description: >
      Comma-separated `// Group:` tag list. Surviving specs whose Group
      shares any tag dispatch first, surfacing flagged tests early.
      A spec matching both sort-first and sort-last goes to sort-first.
      Cypress only.
    required: false
    default: ""
  cypress-sort-last:
    description: >
      Comma-separated `// Group:` tag list. Surviving specs whose Group
      shares any tag dispatch last, keeping known-broken tests at the
      back of the queue. Cypress only.
    required: false
    default: "@known_issue"

  # ── Detox-specific ───────────────────────────────────────────────────
  detox-dir:
    description: >
      Path to the Detox project, relative to `repo-dir`. Defaults to
      `detox` (the layout used by mattermost/mattermost-mobile). Only
      consulted when `framework: detox`.
    required: false
    default: detox
  detox-search-path:
    description: >
      Path to search for `*.e2e.ts` specs, relative to `detox-dir`.
      Defaults to `e2e/test`. May instead name a single spec file to
      dispatch exactly one unit. Prefer `@ipad_only` include/exclude tags
      over narrowing the search path for iPad-only runs. Detox only.
    required: false
    default: e2e/test
  detox-exclude-dir:
    description: >
      Optional directory name to skip during the walk (exact name at any
      depth). Prefer `detox-include-tags` / `detox-exclude-tags` (e.g.
      `@ipad_only`) over directory filters — specs may move. Empty
      disables. Detox only.
    required: false
    default: ""
  detox-include-tags:
    description: >
      Comma-separated `// Tags:` list (`@snake_case`). A Detox `*.e2e.ts`
      spec is kept only when its preamble `// Tags: @foo @bar` line shares
      at least one tag with this list (e.g. `@ios_pr`, `@ipad_only`).
      Empty disables the include filter. Detox only.
    required: false
    default: ""
  detox-exclude-tags:
    description: >
      Comma-separated `// Tags:` list (`@snake_case`). A Detox spec is
      dropped when its preamble tags share any tag with this list (e.g.
      `@ipad_only`). Applied after `detox-include-tags`. Empty disables.
      Detox only.
    required: false
    default: ""

  # ── Maestro-specific ─────────────────────────────────────────────────
  maestro-dir:
    description: >
      Path to the Maestro flow tree, relative to `repo-dir`. Defaults to
      `detox/maestro` (the layout used by mattermost/mattermost-mobile).
      Only consulted when `framework: maestro`.
    required: false
    default: detox/maestro
  maestro-flow-path:
    description: >
      Path to search for `*.yml`/`*.yaml` flow files, relative to
      `maestro-dir`. Defaults to `flows`. May instead name a single flow
      file to dispatch exactly one unit. Maestro only.
    required: false
    default: flows
  maestro-exclude-dir:
    description: >
      Optional directory name to skip during the walk (exact name at any
      depth). Prefer `maestro-exclude-tags` (e.g. `@multi_device`) over
      directory filters — flows may move. Empty disables. Maestro only.
    required: false
    default: ""
  maestro-exclude-tags:
    description: >
      Comma-separated flow `tags:` list (`@snake_case` plan tags and/or
      Zephyr ids). A flow is dropped when its `tags:` shares any tag with
      this list — reproduces mattermost-mobile's `exclude_tags.json`
      without hardcoding it here. Empty disables. Maestro only.
    required: false
    default: ""

outputs:
  run-id:
    description: Server-assigned run id (uuidv7)
  total-units:
    description: Number of dispatch units created on the server
  report-url:
    description: >
      Test System IO report URL for this run — same value used as the
      commit-status `target_url`. Surfaced so downstream steps can reuse
      it (e.g. webhook bodies, additional commit-status updates).

runs:
  using: node24
  main: dist/index.js
