name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to deploy (leave empty to deploy main as .beta + GH prerelease)"
        required: false
        type: string
        default: ""
      confirm_pr_deploy:
        description: "Required for PR deploys: re-type the same PR number to confirm (same-repo PRs only; forks rejected)"
        required: false
        type: string
        default: ""

permissions:
  contents: read     # shared default for checkout / metadata
  actions: read      # check-concurrent (and callers that inspect runs)

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: mattermostdevelopment/mattermost-test-system-io
  CLUSTER: mattermost-test-system-io-staging-cluster
  APP_SERVICE: mattermost-test-system-io-staging-staging-test-io
  PG_SERVICE: mattermost-test-system-io-staging-postgres
  APP_URL: https://staging-test-io.test.mattermost.com

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Reject if another staging deployment is already in progress
  # ---------------------------------------------------------------------------
  check-concurrent:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check for in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IN_PROGRESS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/deploy_staging.yml/runs?status=in_progress" \
            --jq '[.workflow_runs[] | select(.id != '${{ github.run_id }}')] | length')

          if [ "$IN_PROGRESS" -gt 0 ]; then
            echo "::error::Another staging deployment is already in progress. Please wait for it to complete."
            exit 1
          fi

          echo "No other staging deployments in progress. Proceeding."

  # ---------------------------------------------------------------------------
  # Job 2: Resolve deploy source (main → .beta + prerelease; PR → .pr-N, no release)
  # ---------------------------------------------------------------------------
  resolve:
    needs: check-concurrent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      publish_prerelease: ${{ steps.meta.outputs.publish_prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve ref and image tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CONFIRM_PR_DEPLOY: ${{ inputs.confirm_pr_deploy }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(echo "${PR_NUMBER:-}" | tr -d '[:space:]')"
          CONFIRM_PR_DEPLOY="$(echo "${CONFIRM_PR_DEPLOY:-}" | tr -d '[:space:]')"

          if [ -z "$PR_NUMBER" ]; then
            COMMIT_SHA=$(gh api "repos/${REPO}/commits/main" --jq '.sha')
            PUBLISH_PRERELEASE=true
            SUFFIX="beta"
            echo "Deploying main @ ${COMMIT_SHA}"
          else
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number must be a positive integer (got: ${PR_NUMBER})"
              exit 1
            fi
            if [ "$CONFIRM_PR_DEPLOY" != "$PR_NUMBER" ]; then
              echo "::error::PR deploy requires confirm_pr_deploy to match pr_number (got confirm_pr_deploy='${CONFIRM_PR_DEPLOY}')."
              exit 1
            fi
            PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            STATE=$(echo "$PR_JSON" | jq -r '.state')
            if [ "$STATE" != "open" ]; then
              echo "::error::PR #${PR_NUMBER} is not open (state=${STATE})"
              exit 1
            fi
            HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head.repo.full_name // empty')
            IS_FORK=$(echo "$PR_JSON" | jq -r '(.head.repo.fork // false) or (.head.repo.full_name != .base.repo.full_name)')
            if [ "$IS_FORK" = "true" ] || [ "$HEAD_REPO" != "$REPO" ]; then
              echo "::error::Refusing to deploy fork PR #${PR_NUMBER} (head=${HEAD_REPO:-unknown}). Only same-repository PRs are allowed."
              exit 1
            fi
            COMMIT_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
            HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref')
            PUBLISH_PRERELEASE=false
            SUFFIX="pr-${PR_NUMBER}"
            echo "Deploying PR #${PR_NUMBER} (${HEAD_REF}) @ ${COMMIT_SHA}"
          fi

          # VERSION file lives on the commit we will build.
          VERSION=$(gh api "repos/${REPO}/contents/apps/server/VERSION?ref=${COMMIT_SHA}" \
            --jq '.content' | base64 -d | tr -d '[:space:]')
          SHORT_SHA="${COMMIT_SHA::7}"
          IMAGE_TAG="${VERSION}-${SHORT_SHA}.${SUFFIX}"

          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "publish_prerelease=${PUBLISH_PRERELEASE}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "PUBLISH_PRERELEASE=${PUBLISH_PRERELEASE}"

  # ---------------------------------------------------------------------------
  # Job 3: Run CI checks against the resolved commit
  # ---------------------------------------------------------------------------
  ci:
    needs: [check-concurrent, resolve]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit_sha }}

  # ---------------------------------------------------------------------------
  # Job 4: Build Docker image; create GH prerelease only for main/.beta
  # ---------------------------------------------------------------------------
  build-and-tag:
    needs: [check-concurrent, resolve, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create for main/.beta prereleases
    # Gate the Docker Hub push behind the `staging` environment so secret
    # access (DOCKERHUB_DEV_*) is governed by the same review / branch-
    # protection rules configured on that environment, matching the gate
    # already applied to the deploy job below.
    environment: staging
    outputs:
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      commit_sha: ${{ needs.resolve.outputs.commit_sha }}
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          persist-credentials: false

      - name: Set build metadata
        id: meta
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=${BUILD_TIME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_DEV_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DEV_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.resolve.outputs.image_tag }}
          # VERSION is the base semver only (e.g. 0.5.0). The binary reports
          # it via /api/v1/info.server_version and in structured logs. Keeping
          # it bare lets the same immutable artifact carry a version string
          # that matches the production Docker tag (IMAGE:0.5.0) after
          # deploy_production.yml retags without rebuilding. The SHA suffix
          # is preserved in COMMIT_SHA (and in the Docker image tag itself)
          # so every build is uniquely identifiable.
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            COMMIT_SHA=${{ needs.resolve.outputs.commit_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.image_tag }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Create GitHub prerelease (main / .beta only)
        if: needs.resolve.outputs.publish_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          gh release create "$IMAGE_TAG" \
            --prerelease \
            --target "$COMMIT_SHA" \
            --title "Beta $IMAGE_TAG" \
            --generate-notes \
            --notes "Docker image: [\`${{ env.IMAGE }}:${IMAGE_TAG}\`](https://hub.docker.com/r/${{ env.IMAGE }}/tags?name=${IMAGE_TAG})"

  # ---------------------------------------------------------------------------
  # Job 5: Deploy to staging (migration path)
  #   - Fresh PostgreSQL container
  #   - Deploy latest release first, then deploy the built image (exercises migrations)
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write # AWS OIDC
      contents: read
    environment: staging
    env:
      IMAGE_TAG: ${{ needs.build-and-tag.outputs.image_tag }}
      COMMIT_SHA: ${{ needs.build-and-tag.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-and-tag.outputs.commit_sha }}
          fetch-depth: 0   # full history needed for the infra-changed diff below
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Decide whether CDK deploy is needed by comparing infra/** between the
      # currently-running staging commit (read from /api/v1/info) and the
      # commit being deployed. Fails open: if the previous SHA can't be
      # determined or isn't in the fetched history, CDK deploy runs as a
      # precaution rather than risking task-definition drift.
      - name: Detect infra changes since last staging deploy
        id: infra-changed
        run: |
          PREVIOUS_SHA=$(curl -sf "$APP_URL/api/v1/info" | jq -r '.commit_sha // empty' || true)

          if [ -z "$PREVIOUS_SHA" ]; then
            echo "::warning::could not read commit_sha from $APP_URL/api/v1/info — running CDK deploy as a precaution"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify --quiet "${PREVIOUS_SHA}^{commit}" >/dev/null; then
            echo "::warning::previous SHA ${PREVIOUS_SHA} not in fetched history — running CDK deploy as a precaution"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INFRA_CHANGES=$(git diff --name-only "$PREVIOUS_SHA" "$COMMIT_SHA" -- infra/ || true)
          if [ -z "$INFRA_CHANGES" ]; then
            echo "no infra/ changes between ${PREVIOUS_SHA} and ${COMMIT_SHA} — skipping CDK deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "infra/ changes detected:"
            echo "$INFRA_CHANGES"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.infra-changed.outputs.should_deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        if: steps.infra-changed.outputs.should_deploy == 'true'
        working-directory: infra
        run: npm ci

      # Must precede the image-swap steps below. The image swaps are
      # field-level patches — they copy the existing task definition and
      # replace only `image`, so any new env var, secret binding, or IAM
      # grant added to StagingAppStack only reaches staging when CDK has
      # refreshed the task definition first.
      - name: Deploy StagingAppStack
        if: steps.infra-changed.outputs.should_deploy == 'true'
        working-directory: infra
        # Required by infra/lib/config.ts; synth fails fast if unset.
        # Locally these come from infra/.env (gitignored).
        env:
          ROUTE53_ZONE_ID: ${{ secrets.ROUTE53_ZONE_ID }}
          CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
        run: |
          npx cdk deploy StagingAppStack \
            --require-approval never \
            -c imageTag="${IMAGE_TAG}"

      - name: Force new PostgreSQL deployment
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$PG_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for PostgreSQL to be healthy
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$PG_SERVICE"

      - name: Fetch latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_RELEASE=$(gh release list \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" = "null" ]; then
            echo "::warning::No previous release found. Skipping migration step — deploying beta directly."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest_release=${LATEST_RELEASE}" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "Latest release: ${LATEST_RELEASE}"
          fi

      - name: Deploy latest release version first
        if: steps.release.outputs.has_release == 'true'
        id: release-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$APP_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "::add-mask::${TASK_DEF_ARN}"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition')

          RELEASE_TAG="${{ steps.release.outputs.latest_release }}"
          # Strip "release-" prefix to get the Docker image version
          RELEASE_VERSION="${RELEASE_TAG#release-}"
          RELEASE_TASK_DEF=$(echo "$TASK_DEF" | \
            jq --arg IMG "${{ env.IMAGE }}:${RELEASE_VERSION}" \
            '(.containerDefinitions[] | select(.name == "app")).image = $IMG |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)')

          RELEASE_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$RELEASE_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "::add-mask::${RELEASE_TASK_DEF_ARN}"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$APP_SERVICE" \
            --task-definition "$RELEASE_TASK_DEF_ARN" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for release version to be stable
        if: steps.release.outputs.has_release == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$APP_SERVICE"

      - name: Deploy beta version
        id: beta-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$APP_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "::add-mask::${TASK_DEF_ARN}"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition')

          BETA_TASK_DEF=$(echo "$TASK_DEF" | \
            jq --arg IMG "${{ env.IMAGE }}:${IMAGE_TAG}" \
            '(.containerDefinitions[] | select(.name == "app")).image = $IMG |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)')

          BETA_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$BETA_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "::add-mask::${BETA_TASK_DEF_ARN}"
          echo "beta_task_def_arn=${BETA_TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$APP_SERVICE" \
            --task-definition "$BETA_TASK_DEF_ARN" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for beta version to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$APP_SERVICE"

      # `aws ecs wait services-stable` returns success whether the service
      # stabilized on the new task definition or on an old one after ECS's
      # circuit breaker rolled back. Compare ARNs to catch the silent-rollback
      # case where the workflow would otherwise report success.
      - name: Verify beta deployment landed (not rolled back)
        env:
          EXPECTED_ARN: ${{ steps.beta-task-def.outputs.beta_task_def_arn }}
        run: |
          RUNNING_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$APP_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ "$RUNNING_ARN" != "$EXPECTED_ARN" ]; then
            echo "::error::ECS rolled back: service is on ${RUNNING_ARN}, expected ${EXPECTED_ARN}. Inspect task logs and service events; a common cause is a task-definition env-var drift (e.g. missing TSIO_SESSION_SECRET) that a 'cdk deploy StagingAppStack' would fix before the next workflow run."
            exit 1
          fi

          echo "Service running expected beta task definition."

      # Hits /api/v1/info to assert the binary the ALB routes to actually
      # matches the beta we built. Guards against load-balancer/DNS cache
      # quirks that could otherwise hide a stale server.
      - name: Verify running binary matches deploy commit
        run: |
          EXPECTED_SHA="${COMMIT_SHA}"
          RUNNING_SHA=$(curl -sf "$APP_URL/api/v1/info" | jq -r '.commit_sha // empty')

          if [ -z "$RUNNING_SHA" ]; then
            echo "::error::/api/v1/info returned no commit_sha (got: $(curl -sf "$APP_URL/api/v1/info" || echo "<request failed>"))"
            exit 1
          fi

          if [ "$RUNNING_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Running binary reports commit_sha=${RUNNING_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi

          echo "Running binary commit_sha matches deploy: ${RUNNING_SHA}"

      - name: Health check
        run: |
          curl -sf "$APP_URL/ready"
