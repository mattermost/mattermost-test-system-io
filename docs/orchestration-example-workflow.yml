# =============================================================================
# Test Shard Orchestration — sample GitHub Actions workflow
# =============================================================================
# This file is a DOCUMENTATION EXAMPLE. It is not executed by this repo's CI;
# the `.yml` extension (and its location under `docs/`) signals that fact.
#
# Copy it into a downstream repo's `.github/workflows/` and adjust as needed.
#
# What this demonstrates:
#   - A single "controller" job that registers an orchestration run with the
#     server (POST /api/v1/orchestration/begin) using a composite identity
#     derived from the GitHub Actions context.
#   - A matrix of "worker" jobs that each loop:
#         POST /api/v1/orchestration/checkout  → get N dispatch units
#         run Playwright on the returned spec files
#         POST /api/v1/orchestration/complete  → report per-spec outcomes
#     and exit cleanly when the server returns `queue_empty: true`.
#   - OIDC-based authentication: each job mints a short-lived GitHub Actions
#     ID token at runtime and presents it as `Authorization: Bearer <jwt>`,
#     matching the auth path exercised by `scripts/upload-seed.js` against
#     the mock JWKS issuer.
#
# Configuration (all configured outside this file):
#   - `vars.ORCH_URL`   — base URL of the orchestrator (e.g.
#                         `https://test-system.example.com`). Set this as a
#                         repository or organization variable.
#   - `vars.ORCH_NAME`  — workflow-defined `name` component of the composite
#                         identity (e.g. `playwright-full-enterprise`). This
#                         must remain stable across re-runs of the same
#                         workflow so retries land on the same run row.
#   - `vars.ORCH_AUDIENCE` — OIDC `aud` claim the orchestrator expects (must
#                            match `TSIO_GITHUB_ACTIONS_OIDC_AUDIENCE` on the
#                            server side). Defaults to `tsio` if unset.
#
# Workers exit cleanly the first time `queue_empty: true` is returned: the run
# may still be in_progress (other workers are draining the tail of the queue),
# but a worker has nothing useful to do once the queue is drained from its
# perspective. The server is the source of truth for run termination.
#
# See `apps/server/api/openapi.yaml` for the full request/response shapes of
# every endpoint used below.
# =============================================================================

name: Playwright (orchestrated)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write   # required so jobs can mint OIDC tokens via the
                    # ACTIONS_ID_TOKEN_REQUEST_* runtime env vars
  contents: read    # actions/checkout

env:
  # The base URL is configured as a repo variable so the workflow file is
  # portable across environments (staging vs. production orchestrators).
  ORCH_URL: ${{ vars.ORCH_URL }}
  ORCH_NAME: ${{ vars.ORCH_NAME || 'playwright-full-enterprise' }}
  ORCH_AUDIENCE: ${{ vars.ORCH_AUDIENCE || 'tsio' }}

jobs:

  # ---------------------------------------------------------------------------
  # Controller: registers the run + the ordered dispatch units. Runs ONCE.
  # ---------------------------------------------------------------------------
  controller:
    name: orch-controller
    runs-on: ubuntu-latest
    outputs:
      identity-json: ${{ steps.identity.outputs.identity-json }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute composite identity
        id: identity
        # The composite identity is { repository, commit_sha, gh_run_id, name,
        # gh_run_attempt }. Every call to /orchestration/* must include the
        # same five fields, so we serialise them once and pass them between
        # steps as JSON.
        run: |
          IDENTITY=$(jq -nc \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg name "${ORCH_NAME}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt}')
          echo "identity-json=${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "Identity: ${IDENTITY}"

      - name: Discover and order spec files
        id: discover
        # Discovery + ordering is workflow-specific. A real implementation
        # might parse spec headers for an estimated-duration tag and pack
        # specs into balanced units. The structure below is illustrative:
        # the orchestrator only cares about the resulting JSON list.
        run: |
          # 1. Find every spec file.
          SPECS=$(find tests -type f -name '*.spec.ts' | sort)

          # 2. Pack them into dispatch_units. The simplest possible policy
          #    (one spec per unit) is shown here; replace with weight-based
          #    bin-packing if your suite has uneven spec runtimes.
          UNITS=$(echo "$SPECS" | jq -R -s -c '
            split("\n")
            | map(select(length > 0))
            | map({ spec_paths: [.] })
          ')

          # 3. Stash the units list for the begin step.
          echo "$UNITS" > dispatch-units.json
          echo "Discovered $(jq length dispatch-units.json) dispatch units"

      - name: Mint OIDC token
        id: oidc
        # GitHub Actions exposes a runtime endpoint for minting ID tokens.
        # The two ACTIONS_ID_TOKEN_REQUEST_* env vars are populated whenever
        # `permissions: id-token: write` is granted. This is the standard
        # "no-action" pattern; no third-party action required.
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ORCH_AUDIENCE}" \
            | jq -r '.value')
          # Mask the token so it never leaks into logs.
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Begin orchestration run
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          IDENTITY: ${{ steps.identity.outputs.identity-json }}
        run: |
          # Compose the BeginRunRequest body: composite identity + run-level
          # config + the dispatch_units array discovered earlier.
          BODY=$(jq -nc \
            --argjson identity "$IDENTITY" \
            --slurpfile units dispatch-units.json \
            '$identity + {
              framework: "playwright",
              branch: "'"${GITHUB_REF_NAME}"'",
              playwright_project: "chromium",
              lease_timeout_ms: 600000,
              run_timeout_ms: 1800000,
              retest_on_fail: true,
              retest_budget: 1,
              dispatch_units: $units[0]
            }')

          # POST /begin is idempotent on (identity + dispatch_units hash):
          # workflow re-runs (same run_id, same attempt) hit the no-op path
          # and return 200 with the existing run snapshot. A retry that
          # changes the unit list returns 409, which is what we want — the
          # workflow is misconfigured if that happens.
          curl -fsSL -X POST "${ORCH_URL}/api/v1/orchestration/begin" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "${BODY}"

  # ---------------------------------------------------------------------------
  # Workers: each one drains units from the orchestrator until queue_empty.
  # ---------------------------------------------------------------------------
  workers:
    name: orch-worker
    needs: controller
    strategy:
      fail-fast: false   # one worker failing must not cancel its peers;
                         # the orchestrator's reaper handles their leases.
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node + install deps
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Resolve gh_job_id for this matrix entry
        id: job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GH-hosted runners ship with the `gh` CLI preinstalled. The Actions
        # REST API exposes per-job IDs at /repos/{owner}/{repo}/actions/runs/
        # {run_id}/jobs — we look ours up by matching on the job name. The
        # naming convention "<job> (<matrix-value>)" is what the GH UI shows
        # for matrix jobs, so we match on that.
        #
        # NOTE: pagination matters once a workflow has >30 jobs. We page
        # through until we find ours.
        run: |
          PAGE=1
          JOB_ID=""
          # GITHUB_JOB is the YAML key of the current job ("workers" here),
          # but the rendered name on the API uses the `name:` value if set.
          # We set `name: orch-worker` above, so that's what we match on.
          EXPECTED_NAME="orch-worker (${{ matrix.shard }})"
          while [ -z "$JOB_ID" ]; do
            RESPONSE=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100&page=${PAGE}")
            JOB_ID=$(echo "$RESPONSE" \
              | jq -r --arg name "$EXPECTED_NAME" \
                  '.jobs[] | select(.name == $name) | .id' \
              | head -n1)
            COUNT=$(echo "$RESPONSE" | jq -r '.jobs | length')
            if [ "$COUNT" -eq 0 ] || [ -n "$JOB_ID" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done
          if [ -z "$JOB_ID" ]; then
            echo "ERROR: could not resolve gh_job_id for '${EXPECTED_NAME}'" >&2
            exit 1
          fi
          echo "gh_job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"
          echo "gh_job_name=orch-worker" >> "$GITHUB_OUTPUT"
          echo "Resolved gh_job_id=${JOB_ID}"

      - name: Mint OIDC token
        id: oidc
        # Each worker mints its own ID token. The token is bound to this
        # specific job (the OIDC `sub` includes the job context), so the
        # orchestrator can tie checkout/complete calls back to a specific
        # GitHub Actions job.
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ORCH_AUDIENCE}" \
            | jq -r '.value')
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Run orchestrated tests
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          IDENTITY: ${{ needs.controller.outputs.identity-json }}
          GH_JOB_ID: ${{ steps.job.outputs.gh_job_id }}
          GH_JOB_NAME: ${{ steps.job.outputs.gh_job_name }}
        # The worker loop:
        #   1. POST /checkout with batch_size=N. The server replies with up
        #      to N dispatch units, or queue_empty: true.
        #   2. If queue_empty, exit 0 cleanly — this worker is done. Other
        #      matrix entries may still be running.
        #   3. Otherwise, gather every spec_path from every returned unit
        #      and run Playwright over the union. Capture per-spec results.
        #   4. POST /complete with one entry per spec we ran. The server
        #      identifies the lease by (run, gh_job_id) — we never see a
        #      lease_id.
        #   5. Loop.
        #
        # Note: a non-zero playwright exit DOES NOT abort the loop. The
        # whole point of orchestration is to record per-spec outcomes;
        # we report failures and keep working.
        run: |
          set -u
          BATCH_SIZE=2

          while :; do
            # ─── checkout ─────────────────────────────────────────────────
            CHECKOUT_BODY=$(jq -nc \
              --argjson identity "$IDENTITY" \
              --arg job_name "$GH_JOB_NAME" \
              --arg job_id "$GH_JOB_ID" \
              --argjson batch "$BATCH_SIZE" \
              '$identity + {gh_job_name:$job_name, gh_job_id:$job_id, batch_size:$batch}')

            CHECKOUT_RESP=$(curl -fsSL -X POST \
              "${ORCH_URL}/api/v1/orchestration/checkout" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "${CHECKOUT_BODY}")

            QUEUE_EMPTY=$(echo "$CHECKOUT_RESP" | jq -r '.queue_empty')
            if [ "$QUEUE_EMPTY" = "true" ]; then
              echo "Queue drained — exiting cleanly."
              break
            fi

            # Gather every spec_path across every unit in this lease.
            SPEC_FILES=$(echo "$CHECKOUT_RESP" | jq -r '[.units[].spec_paths[]] | .[]')
            echo "Leased specs:"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "  $line"
            done <<< "$SPEC_FILES"

            # ─── run playwright ──────────────────────────────────────────
            # We pass the spec list to Playwright explicitly. We tee the
            # exit code per spec so the /complete payload is accurate even
            # when individual specs fail. (A real worker would parse the
            # JSON reporter output for per-spec status, retry counts, and
            # durations; this loop uses a per-spec exit code as a stand-in.)
            RESULTS_JSON='[]'
            while IFS= read -r spec; do
              [ -z "$spec" ] && continue
              START=$(date +%s%3N)
              if npx playwright test "$spec"; then
                STATUS="passed"
              else
                STATUS="failed"
              fi
              END=$(date +%s%3N)
              DURATION=$((END - START))
              RESULTS_JSON=$(echo "$RESULTS_JSON" | jq -c \
                --arg spec "$spec" \
                --arg status "$STATUS" \
                --argjson dur "$DURATION" \
                '. + [{spec_path:$spec, status:$status, actual_duration_ms:$dur}]')
            done <<< "$SPEC_FILES"

            # ─── complete ────────────────────────────────────────────────
            # /complete identifies the lease by (run, gh_job_id) — no
            # lease_id is ever exposed to workers. The report MUST cover
            # every spec in the lease atomically; partial reports return
            # 400 and the lease will eventually expire.
            COMPLETE_BODY=$(jq -nc \
              --argjson identity "$IDENTITY" \
              --arg job_name "$GH_JOB_NAME" \
              --arg job_id "$GH_JOB_ID" \
              --argjson results "$RESULTS_JSON" \
              '$identity + {gh_job_name:$job_name, gh_job_id:$job_id, results:$results}')

            curl -fsSL -X POST \
              "${ORCH_URL}/api/v1/orchestration/complete" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "${COMPLETE_BODY}"
          done

      - name: Upload Playwright artifacts
        if: always()
        # The orchestrator only stores per-spec outcomes + screenshots
        # uploaded via POST /orchestration/screenshots. Full Playwright
        # JSON / HTML reports still go through the existing reports flow
        # (begin → register → upload → complete), keyed by the same
        # composite identity so the per-group page can join both views.
        # Replace the placeholder below with that flow when wiring up a
        # real workflow.
        run: |
          echo "Uploading Playwright artifacts to the reports flow..."
          # node scripts/upload-playwright-results.js \
          #   --identity "$IDENTITY" \
          #   --results-dir test-results/
