# Development infrastructure only (PostgreSQL + MinIO)
# Start with: docker compose -f docker/docker-compose.dev.yml up -d

name: tsio-dev

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: tsio
      POSTGRES_PASSWORD: tsio
      POSTGRES_DB: tsio
    ports:
      - "6432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Chainguard MinIO runs as UID 65532; make the bind mount writable first.
  minio-data-perms:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    entrypoint: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - ./data/minio:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio-data-perms:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # mc alias used by the healthcheck (image has no curl).
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ["mb", "local/reports", "--ignore-existing"]

  adminer:
    image: adminer:5.4.1
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
