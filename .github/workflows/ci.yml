name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: "Git commit SHA or ref to check out (empty = caller github.sha)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # workflow_call: pin to the explicit ref SHA so staging PR deploys isolate.
  # push/pull_request: use github.ref so superseded runs on the same branch/PR
  # share a group and cancel-in-progress can drop stale work.
  group: ci-${{ github.workflow_ref }}-${{ inputs.ref != '' && inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  server-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Verify gofmt
        run: make fmt-check-server

      - name: Vet
        run: make vet-server

      # golangci-lint runs as an action (not `make lint-server`) so the
      # binary is cached between runs and PRs get delta-only annotations.
      # Keep `version` in sync with `GOLANGCI_LINT_VERSION` in the Makefile so
      # CI and local `make lint-server` check against the same ruleset.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4 # keep in sync with Makefile's GOLANGCI_LINT_VERSION
          working-directory: apps/server

      - name: Unit tests (race)
        run: make test-server

  server-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      # make test-server-e2e runs every -tags=e2e package (admin_cli, oidc,
      # contract) against a testcontainers Postgres and exercises embedded
      # migrations as a side-effect.
      - name: Run E2E tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: make test-server-e2e

  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  infra-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  actions-checks:
    # Each composite action under .github/actions/ ships a committed
    # dist/index.js bundle that GH Actions executes directly. The matrix
    # runs format:check / lint / tsc / test / build for every action (test
    # is --if-present since not every action has unit tests yet) and then
    # asserts the dist/ tree on disk matches what `npm run build` just
    # produced — catches PRs that touched src/ without rebuilding.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - test-system-io-dispatch-begin
          - test-system-io-dispatch-run
          - test-system-io-summary
          - test-system-io-report-upload
    defaults:
      run:
        working-directory: .github/actions/${{ matrix.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: .github/actions/${{ matrix.action }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run tsc

      - name: Run tests
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Verify dist is up to date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/ is stale — run 'npm run build' in .github/actions/${{ matrix.action }} and commit the result"
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
