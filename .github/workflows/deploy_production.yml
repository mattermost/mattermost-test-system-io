name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      beta_tag:
        description: "Beta tag to promote (e.g., 0.1.0-abcdefg.beta)"
        required: true
        type: string

permissions:
  id-token: write    # GitHub OIDC for AWS
  contents: write    # Create Git tags and GitHub releases
  actions: read      # Check for concurrent workflow runs

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: mattermostdevelopment/mattermost-test-system-io
  CLUSTER: mattermost-test-system-io-production-cluster
  APP_SERVICE: mattermost-test-system-io-production-test-io
  APP_URL: https://test-io.test.mattermost.com

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Reject if another production deployment is already in progress
  # ---------------------------------------------------------------------------
  check-concurrent:
    runs-on: ubuntu-latest
    steps:
      - name: Check for in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IN_PROGRESS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/deploy_production.yml/runs?status=in_progress" \
            --jq '[.workflow_runs[] | select(.id != '${{ github.run_id }}')] | length')

          if [ "$IN_PROGRESS" -gt 0 ]; then
            echo "::error::Another production deployment is already in progress. Please wait for it to complete."
            exit 1
          fi

          echo "No other production deployments in progress. Proceeding."

  # ---------------------------------------------------------------------------
  # Job 2: Validate beta tag, retag Docker image, create GitHub release
  # ---------------------------------------------------------------------------
  validate-and-retag:
    needs: check-concurrent
    # Same `production` environment as the deploy job so DOCKERHUB_DEV_*
    # secret access here goes through the same review gate. Without this,
    # the retag-and-publish step would have a weaker review boundary than
    # the ECS deploy step.
    environment: production
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.retag.outputs.release_version }}
      beta_commit_sha: ${{ steps.beta-sha.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need full history to verify the beta's commit is an ancestor of main.
          fetch-depth: 0

      - name: Validate beta tag exists as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ inputs.beta_tag }}
        run: |
          IS_PRERELEASE=$(gh release view "$BETA_TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo "not_found")

          if [ "$IS_PRERELEASE" = "not_found" ]; then
            echo "::error::Beta tag '${BETA_TAG}' does not exist as a GitHub release."
            exit 1
          fi

          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::Tag '${BETA_TAG}' is not a prerelease. Only prereleases can be promoted to production."
            exit 1
          fi

          echo "Beta tag '${BETA_TAG}' validated as a prerelease."

      # The release's targetCommitish must be on main. The previous
      # `isPrerelease` check confirms the release type but not its
      # provenance — nothing stops a release object from pointing at
      # an arbitrary commit. Combined with the image-label check below,
      # this keeps prod aligned with what's been merged to main.
      - name: Resolve and verify beta commit
        id: beta-sha
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ inputs.beta_tag }}
        run: |
          BETA_COMMIT=$(gh release view "$BETA_TAG" --json targetCommitish --jq '.targetCommitish')
          if [ -z "$BETA_COMMIT" ] || [ "$BETA_COMMIT" = "null" ]; then
            echo "::error::Could not read targetCommitish for ${BETA_TAG}"
            exit 1
          fi

          # `targetCommitish` is sometimes a branch name and sometimes a
          # SHA; resolve to a SHA either way. Persist the resolved SHA so
          # later steps (--target, /api/v1/info verify, image-label diff)
          # compare against a fixed commit instead of re-reading a moving
          # branch ref.
          BETA_SHA=$(git rev-parse "${BETA_COMMIT}^{commit}" 2>/dev/null || true)
          if [ -z "$BETA_SHA" ]; then
            echo "::error::Beta commit ${BETA_COMMIT} not in fetched history"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BETA_SHA" origin/main; then
            echo "::error::Beta commit ${BETA_SHA} is not an ancestor of origin/main — refusing to promote off-trunk build to production."
            exit 1
          fi

          echo "commit_sha=${BETA_SHA}" >> "$GITHUB_OUTPUT"
          echo "Beta commit ${BETA_SHA} confirmed on main."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_DEV_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DEV_TOKEN }}

      - name: Validate beta image exists and matches GH release commit
        env:
          BETA_TAG: ${{ inputs.beta_tag }}
          GH_TOKEN: ${{ github.token }}
          BETA_SHA: ${{ steps.beta-sha.outputs.commit_sha }}
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:${BETA_TAG}"

          # Cross-check the image's embedded commit_sha against the resolved
          # beta SHA (from the earlier "Resolve and verify beta commit" step)
          # so a Docker tag rewritten out-of-band can't be promoted to
          # production. Comparing against the raw GH release targetCommitish
          # would have failed on releases where that field is still a branch
          # ref. Image labels are written by deploy_staging.yml's build-push
          # step.
          IMAGE_REVISION=$(docker buildx imagetools inspect "${{ env.IMAGE }}:${BETA_TAG}" \
            --format '{{ json .Manifest }}' | \
            jq -r '.annotations["org.opencontainers.image.revision"] // empty' 2>/dev/null || true)

          if [ -z "$IMAGE_REVISION" ]; then
            echo "::warning::Image ${BETA_TAG} has no org.opencontainers.image.revision label. Older images built before label support were added are exempt; new builds MUST have it."
          elif [ "$IMAGE_REVISION" != "$BETA_SHA" ]; then
            echo "::error::Image revision ($IMAGE_REVISION) does not match resolved beta commit SHA ($BETA_SHA). Image and release are out of sync — refusing to promote."
            exit 1
          else
            echo "Image revision matches resolved beta commit SHA: ${BETA_SHA}"
          fi

      - name: Extract release version
        id: retag
        env:
          BETA_TAG: ${{ inputs.beta_tag }}
        run: |
          # Extract release version by stripping -{sha}.beta suffix
          RELEASE_VERSION=$(echo "$BETA_TAG" | sed 's/-[a-f0-9]*\.beta$//')

          RELEASE_TAG="release-${RELEASE_VERSION}"

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${RELEASE_VERSION}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Retag Docker image
        env:
          BETA_TAG: ${{ inputs.beta_tag }}
          RELEASE_VERSION: ${{ steps.retag.outputs.release_version }}
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${RELEASE_VERSION}" \
            --tag "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${BETA_TAG}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.retag.outputs.release_version }}
          COMMIT_SHA: ${{ steps.beta-sha.outputs.commit_sha }}
          NOTES: "Docker image: [`${{ env.IMAGE }}:${{ steps.retag.outputs.release_version }}`](https://hub.docker.com/r/${{ env.IMAGE }}/tags?name=${{ steps.retag.outputs.release_version }})"
        run: |
          RELEASE_TAG="release-${RELEASE_VERSION}"

          # The image retag above is destructive (it overwrites :latest and
          # :<version> on Docker Hub). If a later step in this job fails and
          # we rerun the workflow, gh release create would fail with
          # "release already exists" and block the retry. Edit in place when
          # the release is already present so reruns succeed.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              --title "Release $RELEASE_VERSION" \
              --latest \
              --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              --title "Release $RELEASE_VERSION" \
              --latest \
              --generate-notes \
              --notes "$NOTES"
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to production ECS
  # ---------------------------------------------------------------------------
  deploy:
    needs: validate-and-retag
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_VERSION: ${{ needs.validate-and-retag.outputs.release_version }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0   # full history needed for the infra-changed diff below

      # Decide whether CDK deploy is needed by comparing infra/** between the
      # currently-running production commit (read from /api/v1/info) and the
      # beta commit being promoted. Fails open: if the previous SHA can't be
      # determined or isn't in the fetched history, CDK deploy runs as a
      # precaution rather than risking task-definition drift.
      - name: Detect infra changes since last production deploy
        id: infra-changed
        env:
          BETA_SHA: ${{ needs.validate-and-retag.outputs.beta_commit_sha }}
        run: |
          PREVIOUS_SHA=$(curl -sf "$APP_URL/api/v1/info" | jq -r '.commit_sha // empty' || true)

          if [ -z "$PREVIOUS_SHA" ]; then
            echo "::warning::could not read commit_sha from $APP_URL/api/v1/info — running CDK deploy as a precaution"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify --quiet "${PREVIOUS_SHA}^{commit}" >/dev/null; then
            echo "::warning::previous SHA ${PREVIOUS_SHA} not in fetched history — running CDK deploy as a precaution"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INFRA_CHANGES=$(git diff --name-only "$PREVIOUS_SHA" "$BETA_SHA" -- infra/ || true)
          if [ -z "$INFRA_CHANGES" ]; then
            echo "no infra/ changes between ${PREVIOUS_SHA} and ${BETA_SHA} — skipping CDK deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "infra/ changes detected:"
            echo "$INFRA_CHANGES"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.infra-changed.outputs.should_deploy == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        if: steps.infra-changed.outputs.should_deploy == 'true'
        working-directory: infra
        run: npm ci

      # Must precede the image-swap step below. The image swap is a
      # field-level patch — it copies the existing task definition and
      # replaces only `image`, so any new env var, secret binding, or IAM
      # grant added to ProductionAppStack only reaches production when CDK
      # has refreshed the task definition first.
      - name: Deploy ProductionAppStack
        if: steps.infra-changed.outputs.should_deploy == 'true'
        working-directory: infra
        # Required by infra/lib/config.ts; synth fails fast if unset.
        # Locally these come from infra/.env (gitignored).
        env:
          ROUTE53_ZONE_ID: ${{ secrets.ROUTE53_ZONE_ID }}
          CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
        run: |
          npx cdk deploy ProductionAppStack \
            --require-approval never \
            -c imageTag="${RELEASE_VERSION}"

      - name: Fetch current task definition and update image
        id: task-def
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$APP_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "::add-mask::${TASK_DEF_ARN}"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition')

          NEW_TASK_DEF=$(echo "$TASK_DEF" | \
            jq --arg IMG "${{ env.IMAGE }}:${RELEASE_VERSION}" \
            '(.containerDefinitions[] | select(.name == "app")).image = $IMG |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "::add-mask::${NEW_TASK_DEF_ARN}"
          echo "new_task_def_arn=${NEW_TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"

      - name: Update production service
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$APP_SERVICE" \
            --task-definition "${{ steps.task-def.outputs.new_task_def_arn }}" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$APP_SERVICE"

      # `aws ecs wait services-stable` returns success whether the service
      # stabilized on the new task definition or on an old one after ECS's
      # circuit breaker rolled back. Compare ARNs to catch the silent-rollback
      # case where the workflow would otherwise report success.
      - name: Verify deployment landed (not rolled back)
        env:
          EXPECTED_ARN: ${{ steps.task-def.outputs.new_task_def_arn }}
        run: |
          RUNNING_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$APP_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ "$RUNNING_ARN" != "$EXPECTED_ARN" ]; then
            echo "::error::ECS rolled back: service is on ${RUNNING_ARN}, expected ${EXPECTED_ARN}. Inspect task logs and service events in the ECS console."
            exit 1
          fi

          echo "Service running expected production task definition."

      # Hits /api/v1/info to assert the binary behind the ALB actually matches
      # the beta we're promoting. Guards against load-balancer/DNS cache
      # quirks that could otherwise hide a stale server.
      - name: Verify running binary matches promoted beta
        env:
          EXPECTED_SHA: ${{ needs.validate-and-retag.outputs.beta_commit_sha }}
        run: |
          RUNNING_SHA=$(curl -sf "$APP_URL/api/v1/info" | jq -r '.commit_sha // empty')

          if [ -z "$RUNNING_SHA" ]; then
            echo "::error::/api/v1/info returned no commit_sha (got: $(curl -sf "$APP_URL/api/v1/info" || echo "<request failed>"))"
            exit 1
          fi

          if [ "$RUNNING_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Running binary reports commit_sha=${RUNNING_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi

          echo "Running binary commit_sha matches promoted beta: ${RUNNING_SHA}"

      - name: Health check
        run: |
          curl -sf "$APP_URL/ready"
