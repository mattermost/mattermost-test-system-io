version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - perfsprint
    - revive
    - staticcheck
    - unused

  settings:
    gocyclo:
      # Handlers that do per-step error checking naturally exceed 15; setting
      # the threshold at 30 still flags genuinely branchy code without churning
      # on every HTTP handler and ingest parser.
      min-complexity: 30
    govet:
      enable-all: true
      disable:
        # fieldalignment is pedantic for small structs; churn outweighs the
        # micro-wins for our domain types.
        - fieldalignment
        # shadow flags the idiomatic `if err := X(); err != nil {...}` pattern;
        # unless there's a bug-prevention case we haven't hit, it's noise.
        - shadow
    gosec:
      excludes:
        - G104
    misspell:
      locale: US

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocyclo
      # Keep the idiomatic `t *testing.T` signature even when the body doesn't
      # touch t — the name is load-bearing for readers and IDE test discovery.
      - path: _test\.go
        text: 'parameter ''t'' seems to be unused'
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
