name: Test System IO — dispatch begin
description: >
  Walk the Playwright spec directory and POST /api/v1/orchestration/begin
  to create the dispatch queue for this composite identity. Authenticates
  to Test System IO via the calling workflow's GitHub Actions OIDC token,
  so the workflow MUST grant `permissions: id-token: write`.
author: Mattermost

inputs:
  use-staging:
    description: >
      When true, target the staging deployment
      (https://staging-test-io.test.mattermost.com) instead of production
      (https://test-io.test.mattermost.com).
    required: false
    default: "false"
  oidc-audience:
    description: OIDC audience claim that the orchestrator expects
    required: false
    default: mattermost-test-system-io
  composite-identity:
    description: >
      Composite identity JSON with the keys repository, commit_sha,
      gh_run_id, gh_run_attempt, name, and (optional) branch / gh_pr_number.
      Same payload the worker action receives.
    required: true
  repo-dir:
    description: >
      Path to the checked-out repo whose Playwright suite this run covers
      (e.g. mattermost/mattermost). The action enumerates spec files under
      `<repo-dir>/<playwright-dir>/specs`.
    required: true
  total-reports-expected:
    description: >
      Number of per-shard reports the run will produce (== the worker
      matrix size). Frozen on first /reports/begin; the report group
      auto-finalizes once that many child reports reach `complete`.
    required: true
  playwright-dir:
    description: >
      Path to the Playwright project, relative to `repo-dir`. Defaults to
      `e2e-tests/playwright` (the layout used by mattermost/mattermost);
      override for repos that put Playwright somewhere else.
    required: false
    default: e2e-tests/playwright
  playwright-project:
    description: >
      Playwright project name passed through to workers as the
      `--project=` arg. Defaults to `chrome`.
    required: false
    default: chrome
  retest-on-fail:
    description: Whether the orchestrator should re-dispatch failed dispatch units once
    required: false
    default: "false"
  retest-budget:
    description: >
      Maximum number of retest passes the orchestrator will dispatch when
      `retest-on-fail` is true. Ignored when `retest-on-fail` is false.
    required: false
    default: "1"
  idle-timeout-ms:
    description: >
      Inactivity window (ms) after which the orchestrator transitions an
      idle run to `timed_out`. Bumped on every checkout / complete, so
      any progress resets the clock.
    required: false
    default: "600000"
  lease-timeout-ms:
    description: >
      Per-lease ceiling (ms) before a stuck worker's units are reclaimed
      and re-dispatched.
    required: false
    default: "600000"

outputs:
  run-id:
    description: Server-assigned run id (uuidv7)
  total-units:
    description: Number of dispatch units created on the server

runs:
  using: node24
  main: dist/index.js
